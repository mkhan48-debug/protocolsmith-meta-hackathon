[project]
name = "protocolsmith-meta-hackathon"
version = "0.1.0"
description = "A controlled API-compatibility prototype using black-box evidence, constrained model reasoning, and deterministic verification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Muhammad Rafae Khan", email = "mkhan48-debug@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.41.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://mkhan48-debug.github.io/protocolsmith-meta-hackathon/"
Repository = "https://github.com/mkhan48-debug/protocolsmith-meta-hackathon"
Issues = "https://github.com/mkhan48-debug/protocolsmith-meta-hackathon/issues"

[project.scripts]
protocolsmith = "protocolsmith_meta_hackathon.demo:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
