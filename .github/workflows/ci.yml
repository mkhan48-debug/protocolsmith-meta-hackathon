name: ProtocolSmith CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --all-groups

      - name: Compile Python files
        run: uv run python -m compileall -q src scripts tests

      - name: Run unit tests
        run: uv run pytest -q --ignore=tests/test_e2e.py

      - name: Run live HTTP end-to-end proof
        run: uv run pytest -q tests/test_e2e.py

